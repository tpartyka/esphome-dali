esphome:
  name: dali-api-client-host-test

host:

external_components:
  - source:
      type: local
      path: ../../components
    components: [dali_api_client]

http_request:
  id: dali_http
  timeout: 1s

dali_api_client:
  id: dali_remote
  http_request_id: dali_http
  base_url: http://dali-controller.local:8080

light:
  - platform: dali_api_client
    name: Remote DALI Lamp 3
    dali_api_client_id: dali_remote
    address: 3

interval:
  - interval: 60s
    then:
      - dali_api_client.recall_scene:
          dali_api_client_id: dali_remote
          scene: 4
          target: group
          address: 3
