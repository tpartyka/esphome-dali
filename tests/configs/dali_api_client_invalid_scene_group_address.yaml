esphome:
  name: dali-api-invalid-scene-group

host:

external_components:
  - source:
      type: local
      path: ../../components
    components: [dali_api_client]

http_request:
  id: dali_http
  timeout: 1s

dali_api_client:
  id: dali_remote
  http_request_id: dali_http
  base_url: http://dali-controller.local:8080

interval:
  - interval: 1min
    then:
      - dali_api_client.recall_scene:
          dali_api_client_id: dali_remote
          scene: 1
          target: group
          address: 16
