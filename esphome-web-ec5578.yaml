esphome:
  name: esphome-web-ec5578
  friendly_name: LightCoordinator
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG
  logs:
    dali: DEBUG

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components
    components: [dali]

# Bit-banged 1200 baud DALI bus (master)
dali:
  id: dali_bus
  state_poll_interval: 10s
  tx_pin: GPIO4
  rx_pin:
    number: GPIO5
    inverted: true
  discovery: true                  # Auto-discover devices on the bus
  initialize_addresses: none # unassigned   # Auto-assign short addresses if needed
  expose_dashboard: true
  dashboard_port: 8080
